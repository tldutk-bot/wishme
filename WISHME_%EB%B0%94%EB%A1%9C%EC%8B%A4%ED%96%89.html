<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E8E8DF">
  <meta name="description" content="WISHME — 먹고 싶은 걸, 내게 맞게. 개인 맞춤형 비건·글루텐프리 디저트 서비스 UI 프로토타입">
  <title>WISHME | 먹고 싶은 걸, 내게 맞게.</title>
  <style>
:root {
  --main: #E8E8DF;
  --main-2: #E2E5DA;
  --sub: #53634F;
  --ink: #30342E;
  --accent: #766454;
  --surface: #F8F8F5;
  --line: #D9DDD2;
  --shadow: 0 8px 24px rgba(46,51,40,.09);
  --soft-shadow: 0 3px 12px rgba(43,48,41,.07);
  --font: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html,body { margin:0; min-height:100%; font-family:var(--font); color:var(--ink); }
body { background:#E6E3D9; -webkit-font-smoothing:antialiased; }
button, input, select { font:inherit; }
button { cursor:pointer; border:0; -webkit-tap-highlight-color:transparent; }
button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--sub); outline-offset:3px; }
button:active { transform:scale(.965); }
button, a { transition:transform .14s ease, background .18s ease, opacity .15s ease, box-shadow .18s ease; }
[hidden] { display:none!important; }
.icon-library { position:absolute; width:0; height:0; overflow:hidden; }
.ico { display:inline-block; width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.85; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
.stage { min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:14px 14px; }
.device { position:relative; width:440px; height:min(870px,calc(100dvh - 70px)); min-height:650px; background:#11120F; border:15px solid #10110F; border-radius:65px; overflow:hidden; box-shadow:0 12px 36px rgba(39,40,35,.10); }
.device-notch { position:absolute; top:0; left:50%; z-index:8; transform:translateX(-50%); width:51%; height:30px; background:#10110F; border-radius:0 0 24px 24px; }
.screen { position:relative; display:flex; flex-direction:column; height:100%; min-height:0; overflow:hidden; border-radius:49px; background:var(--main); }
.status-bar { z-index:2; display:flex; justify-content:space-between; align-items:center; height:38px; min-height:38px; padding:6px 18px 0 18px; background:var(--main); font-size:13px; letter-spacing:-.3px; }
.status-icons { display:flex; align-items:center; gap:5px; color:#111; }
.status-icons svg { width:19px; height:14px; fill:currentColor; }
.status-icons svg:last-child { width:24px; }
.page-content { position:relative; flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; scroll-behavior:smooth; scrollbar-width:none; overscroll-behavior:contain; }
.page-content::-webkit-scrollbar { width:0; display:none; }
.bottom-nav { z-index:3; position:relative; display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:1px; align-items:center; height:69px; min-height:69px; padding:7px 8px 0; background:rgba(248,248,245,.96); border-radius:22px 22px 0 0; box-shadow:0 -4px 18px rgba(69,72,57,.035); }
.nav-button { position:relative; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:3px; height:58px; padding:6px 0; border-radius:16px; color:var(--ink); background:transparent; font-size:11px; font-weight:650; white-space:nowrap; }
.nav-button .ico { width:24px; height:24px; }
.nav-button.active { color:#354A2F; background:var(--main-2); }
.nav-button.active .ico { fill:currentColor; stroke:currentColor; }
.nav-button.active[data-nav="search"] .ico, .nav-button.active[data-nav="saved"] .ico { fill:none; }
.nav-dot { position:absolute; right:22%; top:8px; width:7px; height:7px; border-radius:50%; background:var(--accent); }
.home-indicator { height:12px; min-height:12px; position:relative; background:var(--surface); }
.home-indicator::after { content:""; position:absolute; bottom:6px; left:50%; width:100px; height:4px; border-radius:8px; background:#171816; transform:translateX(-50%); }
.outside-caption { font-size:11px; color:#7d7c70; margin:0; letter-spacing:.1px; }

/* Home: visual rhythm and placement correspond to supplied screenshot */
.home-top { position:relative; isolation:isolate; min-height:255px; padding:0 13px; background:radial-gradient(circle at 70% 25%,#efede4 0,var(--main) 77%); }
.home-photo { position:absolute; top:23px; right:-7px; width:66%; height:205px; object-fit:contain; object-position:right top; z-index:-1; opacity:.97; -webkit-mask-image:linear-gradient(90deg,transparent 0%,black 33%); mask-image:linear-gradient(90deg,transparent 0%,black 33%); }
.app-header { position:relative; display:flex; justify-content:space-between; align-items:center; min-height:79px; padding:6px 2px 0; z-index:1; }
.brand { display:inline-flex; flex-direction:column; align-items:flex-start; }
.logo-holder { position:relative; display:inline-block; }
.logo-holder h1 { font-family:Georgia,"Times New Roman",serif; font-size:34px; line-height:.99; font-weight:800; color:#2f3c28; margin:12px 0 2px; letter-spacing:-1.8px; }
.brand-leaves { position:absolute; top:-1px; left:67px; height:18px; width:25px; fill:#80945b; transform:rotate(5deg); }
.brand-caption { font-size:11px; font-weight:520; letter-spacing:-.2px; color:var(--accent); }
.header-actions { display:flex; gap:8px; align-items:center; }
.icon-button { position:relative; display:flex; align-items:center; justify-content:center; background:transparent; color:var(--ink); padding:6px; border-radius:12px; }
.icon-button:hover { background:rgba(248,248,245,.5); }
.icon-button .ico { width:23px; height:23px; }
.notification-dot { position:absolute; right:4px; top:3px; width:7px; height:7px; background:var(--accent); border:1px solid var(--main); border-radius:50%; }
.cart-count { position:absolute; right:-2px; top:0; min-width:16px; height:16px; padding:1px 4px; border-radius:9px; background:var(--accent); color:white; font-size:10px; font-weight:700; }
.hero-question { position:relative; z-index:1; margin:16px 0 15px 1px; font-size:24px; font-weight:800; line-height:1.28; letter-spacing:-1.4px; }
.search-form { position:relative; z-index:1; display:flex; align-items:center; height:57px; width:100%; padding:7px 8px 7px 13px; border-radius:20px; background:#fff; box-shadow:0 4px 12px rgba(35,40,30,.16); }
.search-input { width:0; flex:1; min-width:0; height:40px; border:none; outline:0; background:transparent; font-size:13.5px; color:var(--ink); letter-spacing:-.3px; }
.search-input::placeholder { color:#777971; opacity:1; }
.search-input:focus-visible { outline:0; }
.search-form:focus-within { outline:2px solid #abb8a0; outline-offset:1px; }
.search-small { display:flex; justify-content:center; align-items:center; width:36px; height:36px; border-radius:50%; background:#f0eee8; color:var(--accent); margin-left:4px; }
.search-small .ico { width:19px; height:19px; }
.search-divider { height:28px; border-left:1px solid #deded7; margin:0 6px; }
.search-submit { width:43px; height:43px; display:flex; justify-content:center; align-items:center; border-radius:50%; background:linear-gradient(145deg,#637658,var(--sub)); color:#fff; }
.search-submit:hover,.green-button:hover { background:#3f513d; box-shadow:0 4px 10px rgba(58,73,51,.15); }
.search-submit .ico { width:22px; height:22px; }
.search-tip { display:flex; align-items:center; justify-content:center; gap:7px; font-size:10.5px; color:var(--accent); margin:10px 0 0; }
.search-tip .ico { width:14px; height:14px; }
.home-sections { padding:3px 12px 22px; }
.section-heading { display:flex; align-items:center; justify-content:space-between; margin:14px 3px 9px; }
.section-heading h2 { font-size:18px; font-weight:800; line-height:1.2; margin:0; letter-spacing:-.9px; }
.text-link { display:flex; align-items:center; gap:1px; background:none; font-size:12px; color:var(--accent); font-weight:650; padding:3px 0 3px 6px; }
.text-link .ico { width:13px; height:13px; }
.category-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; }
.category-card { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; background:var(--surface); border:1px solid rgba(255,255,255,.8); box-shadow:var(--soft-shadow); border-radius:15px; min-width:0; height:89px; padding:7px 3px 5px; color:var(--ink); }
.category-card:hover,.category-card.selected { background:#eef1e9; }
.category-card.selected { outline:2px solid #9eae93; outline-offset:-2px; }
.category-card img { width:100%; height:55px; object-fit:contain; border-radius:10px; }
.category-card span { font-size:12px; font-weight:800; white-space:nowrap; }
.diet-heading { margin-top:22px; }
.diet-chips { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding:1px 0 6px; }
.diet-chips::-webkit-scrollbar { display:none; }
.diet-chip { display:inline-flex; justify-content:center; align-items:center; gap:4px; flex:0 0 auto; min-height:32px; padding:5px 9px; border-radius:25px; background:var(--surface); color:#343d31; box-shadow:var(--soft-shadow); font-size:11px; font-weight:750; white-space:nowrap; }
.diet-chip .ico { width:17px; height:17px; color:#6c875f; }
.recommend-heading { margin-top:11px; }
.recommend-heading h2::after { content:"〃"; display:inline-block; transform:rotate(-29deg) translate(3px,-1px); font-size:16px; color:#8d724f; }
.recipe-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
.recipe-card { overflow:hidden; background:var(--surface); border-radius:13px; box-shadow:var(--soft-shadow); min-width:0; padding:3px 3px 7px; }
.recipe-image-wrap { position:relative; height:102px; overflow:hidden; border-radius:11px; background:#e8e7de; cursor:pointer; }
.recipe-img { width:100%; height:100%; object-fit:cover; object-position:center; display:block; transition:transform .24s ease; }
.recipe-image-wrap:hover .recipe-img { transform:scale(1.04); }
.fav-button { position:absolute; right:7px; top:7px; display:flex; justify-content:center; align-items:center; width:29px; height:29px; background:rgba(255,255,255,.93); border-radius:50%; color:var(--accent); box-shadow:0 2px 6px rgba(0,0,0,.06); }
.fav-button .ico { width:18px; height:18px; }
.fav-button.is-saved { color:#9a5b49; }
.fav-button.is-saved .ico { fill:#9a5b49; }
.recipe-info { padding:7px 7px 0; }
.recipe-info h3 { font-size:13px; font-weight:800; margin:0 0 3px; letter-spacing:-.5px; line-height:1.25; }
.recipe-info p { font-size:10.5px; margin:0 0 9px; color:var(--accent); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.green-button { display:flex; justify-content:center; align-items:center; gap:5px; width:100%; min-height:29px; padding:7px 9px; border-radius:20px; color:#fff; background:linear-gradient(115deg,#627456,#53634F); font-size:11px; font-weight:700; }
.green-button .ico { width:13px; height:13px; }

/* Internal screens */
.inner-view { padding:0 14px 28px; min-height:100%; background:var(--main); }
.inner-view .app-header { padding:0 0 4px; min-height:75px; }
.page-title { font-size:24px; letter-spacing:-1px; margin:16px 1px 5px; line-height:1.35; }
.page-description { color:#65685f; font-size:12px; line-height:1.6; margin:0 1px 15px; }
.sheet-card { padding:17px 14px; background:var(--surface); border:1px solid #eff0e9; border-radius:17px; box-shadow:var(--soft-shadow); margin:10px 0; }
.sheet-card h3 { font-size:15px; margin:0 0 6px; }
.sheet-card p { color:#73766d; font-size:12px; margin:0; line-height:1.6; }
.search-form.inner-search { margin-top:16px; margin-bottom:14px; height:58px; }
.filter-bar { display:flex; gap:7px; overflow-x:auto; padding:0 0 12px; margin:0 0 4px; scrollbar-width:none; }
.filter-bar::-webkit-scrollbar { display:none; }
.filter-pill { border:1px solid #d6dcce; border-radius:20px; background:var(--surface); padding:7px 12px; font-size:12px; font-weight:650; white-space:nowrap; color:#53634f; }
.filter-pill.active { color:white; background:var(--sub); border-color:var(--sub); }
.inner-view .recipe-grid { margin-top:13px; }
.inner-view .recipe-image-wrap { height:126px; }
.inner-view .recipe-info h3 { font-size:13px; }
.summary-line { font-size:12px; font-weight:750; color:var(--accent); margin:7px 2px 11px; }
.empty { display:flex; align-items:center; flex-direction:column; justify-content:center; padding:45px 14px; text-align:center; color:var(--accent); }
.empty .ico { width:42px; height:42px; margin-bottom:14px; }
.empty h3 { margin:0 0 9px; color:var(--ink); font-size:16px; }
.empty p { font-size:12px; line-height:1.7; margin:0 0 15px; }
.empty .green-button { max-width:195px; }
.pref-list { display:flex; flex-direction:column; gap:0; }
.pref-row { display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:60px; padding:10px 3px; border-bottom:1px solid #e7e8df; }
.pref-row:last-child { border-bottom:0; }
.pref-row strong { font-size:13px; }
.pref-row p { font-size:10px; color:#77776e; margin:4px 0 0; }
.toggle { position:relative; width:43px; height:25px; border-radius:30px; padding:0; background:#c5c9bf; flex-shrink:0; }
.toggle::after { content:""; display:block; width:19px; height:19px; margin:3px; border-radius:50%; background:white; transition:transform .2s ease; box-shadow:0 1px 3px #0002; }
.toggle[aria-checked="true"] { background:var(--sub); }
.toggle[aria-checked="true"]::after { transform:translateX(18px); }
.toggle:disabled { opacity:.65; cursor:not-allowed; }
.warning { font-size:11px!important; color:#7a7366!important; line-height:1.65!important; }
.list-entry { display:flex; gap:10px; align-items:center; padding:11px 0; border-bottom:1px solid #e6e9e1; }
.list-entry:last-child { border-bottom:0; }
.list-entry img { width:67px; height:65px; object-fit:cover; border-radius:10px; background:var(--main); }
.list-entry-info { flex:1; min-width:0; }
.list-entry-info strong { display:block; font-size:13px; margin-bottom:5px; }
.list-entry-info span { font-size:11px; color:var(--accent); }
.small-action { display:flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:10px; color:var(--sub); background:var(--main-2); }
.small-action .ico { width:16px; height:16px; }
.segmented { display:grid; grid-template-columns:1fr 1fr; background:#e1e4db; padding:4px; border-radius:14px; margin-top:16px; }
.segmented button { border-radius:10px; background:transparent; padding:10px 3px; font-size:12px; color:var(--accent); font-weight:700; }
.segmented button.active { color:var(--ink); background:var(--surface); box-shadow:0 1px 4px #0001; }
.checkout-strip { margin:16px 0; display:flex; justify-content:space-between; align-items:center; gap:14px; }
.checkout-strip strong { font-size:12px; }
.checkout-strip .green-button { width:150px; }
.file-slot { display:flex; align-items:center; gap:12px; border-bottom:1px solid #e5e8df; padding:11px 0; }
.file-slot:last-child { border:none; }
.file-slot img { width:65px; height:58px; object-fit:cover; border-radius:10px; background:#eaece5; }
.file-slot strong { font-size:11.5px; flex:1; }
.file-slot .small-action { width:auto; padding:0 9px; gap:5px; font-size:11px; }
.file-slot .small-action .ico { width:14px; }

/* Modal and feedback */
.modal-root { position:fixed; inset:0; z-index:50; display:none; align-items:flex-end; justify-content:center; }
.modal-root.show { display:flex; }
.modal-backdrop { position:absolute; inset:0; background:rgba(19,24,18,.45); animation:fade-in .2s ease both; }
.modal-panel { position:relative; width:min(430px,100%); max-height:min(80dvh,760px); overflow-y:auto; padding:18px 18px calc(20px + env(safe-area-inset-bottom,0px)); border-radius:23px 23px 0 0; background:var(--surface); animation:slide-up .22s cubic-bezier(.2,.8,.2,1) both; scrollbar-width:thin; }
.modal-grabber { width:38px; height:4px; background:#d0d5cb; border-radius:10px; margin:-6px auto 15px; }
.modal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.modal-head h2 { margin:0; font-size:18px; }
.modal-close { background:#ecede7; width:31px; height:31px; border-radius:50%; display:grid; place-items:center; color:var(--ink); }
.modal-close .ico { width:16px; }
.modal-image { display:block; width:100%; aspect-ratio:1.6; object-fit:cover; border-radius:14px; background:#e6e5db; margin:10px 0 12px; }
.modal-tags { display:flex; flex-wrap:wrap; gap:5px; margin:10px 0 13px; }
.modal-tags span { padding:6px 9px; border-radius:20px; font-size:11px; background:var(--main-2); color:var(--sub); }
.modal-copy { font-size:12px; line-height:1.75; color:#555d50; margin:10px 0 15px; }
.modal-actions { display:flex; gap:8px; }
.modal-actions .green-button { min-height:42px; flex:1; font-size:13px; }
.outline-button { background:#f2f3ee; color:var(--sub); border:1px solid #dce2d6; border-radius:22px; padding:10px 13px; font-size:12px; font-weight:700; }
.toast { position:absolute; bottom:88px; left:50%; z-index:10; transform:translate(-50%,12px); opacity:0; pointer-events:none; width:max-content; max-width:92%; border-radius:25px; padding:10px 16px; background:rgba(48,52,46,.95); color:#fff; box-shadow:0 7px 20px #0002; font-size:11.5px; line-height:1.4; text-align:center; transition:opacity .2s,transform .2s; }
.toast.visible { opacity:1; transform:translate(-50%,0); }
@keyframes fade-in { from { opacity:0 } to { opacity:1 } }
@keyframes slide-up { from { transform:translateY(25px); opacity:.85 } to { transform:translateY(0); opacity:1 } }
@media (min-width:700px) { .modal-root { align-items:center; } .modal-panel { border-radius:23px; max-height:80dvh; } }
@media (max-width:540px) {
  html,body { height:100%; overflow:hidden; background:var(--main); }
  .stage { display:block; min-height:100dvh; padding:0; }
  .device { width:100%; height:100dvh; min-height:0; border:0; border-radius:0; box-shadow:none; }
  .device-notch, .outside-caption { display:none; }
  .screen { border-radius:0; }
  .status-bar { padding-top:env(safe-area-inset-top,0px); height:calc(32px + env(safe-area-inset-top,0px)); min-height:calc(32px + env(safe-area-inset-top,0px)); }
  .home-indicator { height:calc(8px + env(safe-area-inset-bottom,0px)); min-height:calc(8px + env(safe-area-inset-bottom,0px)); }
  .home-indicator::after { bottom:calc(3px + env(safe-area-inset-bottom,0px)); }
  .bottom-nav { height:calc(66px + env(safe-area-inset-bottom,0px)); min-height:calc(66px + env(safe-area-inset-bottom,0px)); padding-bottom:env(safe-area-inset-bottom,0px); }
  .nav-button { height:55px; }
  .home-photo { width:67%; }
}
@media (max-width:365px) { .hero-question { font-size:22px; } .logo-holder h1 { font-size:31px; } .category-card { height:84px; } .category-card img { height:50px; } .category-card span { font-size:11px; } .diet-chip { padding:5px 7px; font-size:10px; } }
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition:none!important; animation:none!important; } }

</style>
</head>

function searchBox(inner=false) {
  return `<form class="search-form ${inner?'inner-search':''}" id="searchForm">

}
function categoryCards(){
  return `<div class="category-grid">${CATEGORIES.map(c=>`<button type="button" class="category-card" data-category="${c.id}" aria-label="${c.name} 메뉴 보기"><img src="${photo(c.photo)}" alt="${c.name} 이미지" loading="lazy"><span>${c.name}</span></button>`).join('')}</div>`;
}
function dietChips(){
  const chips=[['비건','leaf'],...(state.prefs.gf?[['글루텐프리','wheat-off']]:[]),...(state.prefs.nutFree?[['견과류 제외','check']]:[]),...(state.prefs.soyFree?[['대두 제외','check']]:[]),...(state.prefs.lessSweet?[['덜 단맛','sparkle']]:[])];
  return `<div class="diet-chips" aria-label="나의 식이조건">${chips.map(([label,i])=>`<button type="button" class="diet-chip" data-action="conditions">${icon(i)}${label}</button>`).join('')}</div>`;
}
function matchingPrefs(r) {
  return r.vegan && (!state.prefs.gf || r.gf) && (!state.prefs.nutFree || !r.nuts) && (!state.prefs.soyFree || !r.soy) && (!state.prefs.lessSweet || r.lessSweet);
}
function extractTerms(q) {
  const text=q.trim().toLowerCase();
  const category=CATEGORIES.find(c=>text.includes(c.name))?.id || (/(케이크|딸기|시즌)/.test(text)?'season':null);
  const flour=/(현미)/.test(text)?'현미가루':/(쌀가루|쌀로|쌀 스콘|쌀스콘)/.test(text)?'쌀가루':null;
  const gf=/(글루텐프리|글프|밀가루[가-힣\s]{0,5}(안|없|제외)|밀가루 없이)/.test(text);
  const lessSweet=/(덜\s*달|덜\s*단|달지\s*않|저당|단맛\s*적|단맛\s*줄)/.test(text);
  const nutFree=/(견과.{0,6}(제외|없이|없|알레르기)|아몬드.{0,5}(제외|없이|없))/.test(text);
  const soyFree=/(대두.{0,6}(제외|없이|없|알레르기)|두유.{0,6}(제외|없이|없))/.test(text);
  const terms=[];
  if (category) terms.push(CATEGORIES.find(c=>c.id===category).name);
  if (flour) terms.push(flour);
  if (gf) terms.push('글루텐프리');
  if (lessSweet) terms.push('덜 단맛');
  if (nutFree) terms.push('견과류 제외');
  if (soyFree) terms.push('대두 제외');
  return {category,flour,gf,lessSweet,nutFree,soyFree,terms};
}
function matchedRecipes(extra=null,ignoreCategory=false){
  const term=extra||{};
  return RECIPES.filter(r=>matchingPrefs(r)
    && (ignoreCategory || state.category==='all' || r.category===state.category)
    && (!term.category || r.category===term.category)
    && (!term.flour || r.flour.includes(term.flour))
    && (!term.gf || r.gf)
    && (!term.lessSweet || r.lessSweet)
    && (!term.nutFree || !r.nuts)
    && (!term.soyFree || !r.soy));
}
function recipeCards(list){
  if (!list.length) return `<div class="empty">${icon('search')}<h3>일치하는 예시 메뉴가 없습니다.</h3><p>검색어를 바꾸거나 식이조건을 수정해 보세요.<br>실제 제공 가능 여부는 레시피 DB 확인이 필요합니다.</p><button class="green-button" type="button" data-action="conditions">식이조건 수정 ${icon('chevron')}</button></div>`;
  return `<div class="recipe-grid">${list.map(r=>`<article class="recipe-card">
    <div class="recipe-image-wrap" data-detail="${r.id}" role="button" tabindex="0" aria-label="${r.name} 상세 보기"><img class="recipe-img" src="${photo(r.photo)}" alt="${r.name} 사진" loading="lazy">
    <button type="button" class="fav-button ${isFav(r.id)?'is-saved':''}" data-fav="${r.id}" aria-label="${r.name} ${isFav(r.id)?'찜 해제':'찜하기'}">${icon('heart')}</button></div>
    <div class="recipe-info"><h3>${escapeHTML(r.name)}</h3><p>${r.tags.slice(0,3).join(' · ')}</p></div>
    <button type="button" class="green-button" data-detail="${r.id}">자세히 보기 ${icon('chevron')}</button>
  </article>`).join('')}</div>`;
}
function home(){
  const recommendation=matchedRecipes(null,true).slice(0,2);
  return `<div class="home-top"><img class="home-photo" src="${photo('hero')}" alt="대표 간식 스콘 사진">
    ${header()}<h2 class="hero-question">오늘은 어떤 간식이<br>먹고 싶나요?</h2>
    ${searchBox()}<p class="search-tip">${icon('volume')}자연어 또는 음성으로 조건을 입력해 보세요.</p>

  </div>`;
}

  const pills=[{id:'all',name:'전체'},...CATEGORIES];

function results(){
  const terms=extractTerms(state.searchQuery);
  const list=state.searchQuery.trim()?(terms.terms.length?matchedRecipes(terms,true):[]):matchedRecipes(null,true);
  return `<div class="inner-view">${header()}<h2 class="page-title">내게 맞는 간식 찾기</h2><p class="page-description">먹고 싶은 간식과 원하는 조건을 편하게 입력해 보세요.</p>${searchBox(true)}
    ${state.searchQuery.trim()?`<div class="sheet-card"><h3>입력하신 검색 조건</h3><p>${escapeHTML(state.searchQuery)}</p>${terms.terms.length?`<div class="modal-tags">${terms.terms.map(t=>`<span>${escapeHTML(t)}</span>`).join('')}</div>`:`<p style="margin-top:7px">추출된 조건이 없습니다. 메뉴 이름이나 재료를 넣어 보세요.</p>`}</div>`:''}
    <div class="section-heading"><h2>${state.searchQuery.trim()?'검색 결과':'조건별 추천'}</h2><button class="text-link" type="button" data-action="conditions">조건 수정 ${icon('chevron')}</button></div>
    <div class="summary-line">예시 레시피 ${list.length}개 · 비건 기본 적용</div>${recipeCards(list)}
    <div class="sheet-card"><p class="warning">이 화면은 입력문에서 키워드를 찾고 예시 데이터와 대조하는 프런트엔드 시연입니다. 실제 자체 레시피 DB·조건 매칭 엔진은 아직 연결되지 않았습니다.</p></div>
  </div>`;
}
function saved(){
  const isWishlist=state.savedTab==='favorites';
  const savedEntries=state.favorites.map(recipe).filter(Boolean);
  const cartEntries=Object.entries(state.cart).filter(([,n])=>n>0).map(([id,qty])=>({...recipe(id),qty})).filter(r=>r.id);
  return `<div class="inner-view">${header()}<h2 class="page-title">찜한 간식과 장바구니</h2><p class="page-description">마음에 드는 간식을 모아 보고, 원하는 메뉴를 담아 보세요.</p>
   <div class="segmented"><button type="button" data-saved-tab="favorites" class="${isWishlist?'active':''}">찜 목록 (${savedEntries.length})</button><button type="button" data-saved-tab="cart" class="${!isWishlist?'active':''}">장바구니 (${cartEntries.reduce((s,r)=>s+r.qty,0)})</button></div>
   ${isWishlist?(savedEntries.length?`<div class="sheet-card">${savedEntries.map(r=>`<div class="list-entry"><img src="${photo(r.photo)}" alt="${r.name}"><div class="list-entry-info"><strong>${r.name}</strong><span>${r.tags.slice(0,2).join(' · ')}</span></div><button class="small-action" data-detail="${r.id}" aria-label="${r.name} 상세">${icon('chevron')}</button></div>`).join('')}</div>`:
   `<div class="empty">${icon('heart')}<h3>아직 찜한 간식이 없어요.</h3><p>원하는 간식의 하트를 눌러 저장해 보세요.</p><button class="green-button" data-nav="menu">메뉴 둘러보기 ${icon('chevron')}</button></div>`):
   (cartEntries.length?`<div class="sheet-card">${cartEntries.map(r=>`<div class="list-entry"><img src="${photo(r.photo)}" alt="${r.name}"><div class="list-entry-info"><strong>${r.name}</strong><span>수량 ${r.qty}개 · 가격 미연동</span></div><button class="small-action" data-quantity="${r.id}" data-delta="-1" aria-label="${r.name} 수량 줄이기">${icon('minus')}</button><button class="small-action" data-quantity="${r.id}" data-delta="1" aria-label="${r.name} 수량 늘리기">${icon('plus')}</button></div>`).join('')}</div><div class="checkout-strip"><strong>총 ${cartEntries.reduce((s,r)=>s+r.qty,0)}개 · 데모 장바구니</strong><button class="green-button" data-action="checkout">주문하기 ${icon('chevron')}</button></div>`:
   `<div class="empty">${icon('bag')}<h3>장바구니가 비어 있어요.</h3><p>간식 상세 화면에서 메뉴를 담아 보세요.</p><button class="green-button" data-nav="menu">메뉴 둘러보기 ${icon('chevron')}</button></div>`)}
  </div>`;
}
function myPage(){
 return `<div class="inner-view">${header()}<h2 class="page-title">마이 위시미</h2><p class="page-description">식이조건을 확인하거나 화면에 사용된 사진을 교체해 보세요.</p>
    <div class="sheet-card"><h3>나의 식이조건</h3><div style="margin-top:9px">${dietChips()}</div><button class="green-button" style="margin-top:9px;min-height:37px" data-action="conditions">식이조건 수정 ${icon('chevron')}</button></div>
    <div class="sheet-card"><h3>사진 교체 (시연용)</h3><p>아래 이미지를 눌러 새 사진을 선택할 수 있습니다. 이 화면에서는 교체한 사진이 즉시 반영되지만, 새로고침하면 원래 사진으로 돌아갑니다.</p>
      ${PHOTO_SLOTS.map(slot=>`<div class="file-slot"><img src="${photo(slot.id)}" alt="${slot.title}"><strong>${slot.title}</strong><button type="button" class="small-action" data-photo="${slot.id}">${icon('camera')} 교체</button></div>`).join('')}
    </div>
    <div class="sheet-card"><h3>서비스 소개</h3><p>WISHME — 먹고 싶은 걸, 내게 맞게.</p><p class="warning" style="margin-top:9px">현재 화면은 기능 확인용 프로토타입입니다. 계정, 주문·결제, 실제 레시피 DB, 알레르기 안전 검토는 구현 범위에 포함되지 않았습니다.</p></div>
 </div>`;
}
function render(keepScroll=false) {
  const container=$('#pageContent');
  const prev=keepScroll?container.scrollTop:0;
  container.innerHTML=({home, menu, search:results, saved, my:myPage}[state.page]||home)();
  document.querySelectorAll('.nav-button').forEach(b=>{
    const active=b.dataset.nav===state.page; b.classList.toggle('active',active);
    if(active) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  $('#savedIndicator').hidden=state.favorites.length===0 && !Object.values(state.cart).some(n=>n>0);
  container.scrollTop=prev;
}
function nav(page,options={}) { state.page=page; if(options.category!==undefined)state.category=options.category; if(options.savedTab)state.savedTab=options.savedTab; render(); }
let toastTimer=null;
function toast(message){
  const node=$('#toast'); node.textContent=message; node.classList.add('visible');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>node.classList.remove('visible'),2600);
}
function setFavorite(id){
  if (isFav(id)) { state.favorites=state.favorites.filter(x=>x!==id); toast('찜 목록에서 삭제했어요.'); }
  else { state.favorites.push(id); toast('찜 목록에 담았어요.'); }
  saveValue('favorites',state.favorites); render(true);
}
function updateCart(id,delta=1){
  state.cart[id]=Math.max(0,(state.cart[id]||0)+delta);
  if(!state.cart[id])delete state.cart[id];
  saveValue('cart',state.cart); render(true);
  toast(delta>0?'장바구니에 담았어요.':'장바구니 수량을 변경했어요.');
}
function modal(content){
  const root=$('#modalRoot');
  root.innerHTML=`<div class="modal-backdrop" data-action="close-modal"></div><section class="modal-panel" role="dialog" aria-modal="true" aria-label="상세 정보"><div class="modal-grabber"></div>${content}</section>`;
  root.classList.add('show');
  document.body.dataset.modalOpen='true';
}
function closeModal(){ const r=$('#modalRoot');r.classList.remove('show');r.innerHTML='';delete document.body.dataset.modalOpen; }
function detail(id){
  const r=recipe(id);if(!r)return;
  modal(`<div class="modal-head"><h2>${escapeHTML(r.name)}</h2><button class="modal-close" data-action="close-modal" aria-label="닫기">${icon('x')}</button></div>
    <img class="modal-image" src="${photo(r.photo)}" alt="${escapeHTML(r.name)} 예시 사진"><div class="modal-tags">${r.tags.map(t=>`<span>${escapeHTML(t)}</span>`).join('')}</div>
    <p class="modal-copy">${escapeHTML(r.short)}<br>${escapeHTML(r.ingredients)}</p>
    <p class="modal-copy warning">시연용 식이정보입니다. 실제 주문 전에는 원재료, 알레르기 유발 성분 및 교차접촉 여부를 검증된 정보로 다시 확인해야 합니다.</p>
    <div class="modal-actions"><button class="outline-button" type="button" data-fav="${r.id}">${isFav(r.id)?'찜 해제':'♡ 찜하기'}</button><button class="green-button" type="button" data-add="${r.id}">장바구니 담기 ${icon('cart')}</button></div>`);
}
const PREF_ENTRIES=[
 {key:'vegan',label:'비건',desc:'동물성 원료 제외 · 기본 적용',locked:true},
 {key:'gf',label:'글루텐프리',desc:'글루텐 함유 원료 제외'},
 {key:'nutFree',label:'견과류 제외',desc:'견과류가 있는 예시 레시피 제외'},
 {key:'soyFree',label:'대두 제외',desc:'대두가 있는 예시 레시피 제외'},
 {key:'lessSweet',label:'덜 단맛',desc:'단맛이 적게 설계된 예시 레시피 선호'},
];
function conditions(){
 modal(`<div class="modal-head"><h2>내 식이조건 수정</h2><button class="modal-close" data-action="close-modal" aria-label="닫기">${icon('x')}</button></div>
   <p class="modal-copy" style="margin-top:0">원하는 조건을 선택하면 예시 메뉴 추천에 즉시 반영됩니다.</p>
   <div class="pref-list">${PREF_ENTRIES.map(p=>`<div class="pref-row"><div><strong>${p.label}</strong><p>${p.desc}</p></div><button type="button" role="switch" class="toggle" data-pref="${p.key}" aria-label="${p.label}" aria-checked="${Boolean(state.prefs[p.key])}" ${p.locked?'disabled title="비건은 기본 조건입니다"':''}></button></div>`).join('')}</div>
   <p class="modal-copy warning">※ 현재 선택은 시연용 레시피 정보에 적용됩니다. 알레르기 안전 여부를 보증하지 않으며 실제 서비스에서는 원재료 및 교차접촉 검증이 필요합니다.</p>
   <button class="green-button" type="button" style="min-height:43px;font-size:13px" data-action="save-conditions">선택 완료 ${icon('check')}</button>`);
}
function showNotifications(){ modal(`<div class="modal-head"><h2>알림</h2><button class="modal-close" data-action="close-modal" aria-label="닫기">${icon('x')}</button></div><div class="empty">${icon('bell')}<h3>새 알림이 없어요.</h3><p>알림 기능은 실제 서비스 연동 시 활성화됩니다.</p></div>`); }
function startVoice(){
  const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!Recognition){ toast('이 브라우저에서는 음성 입력이 지원되지 않습니다.'); return; }
  let recognition;
  try {
    recognition=new Recognition(); recognition.lang='ko-KR';recognition.interimResults=false;recognition.maxAlternatives=1;
    recognition.onresult=(event)=>{ const text=event.results[0][0].transcript;const input=$('#searchForm input[name="query"]');if(input){input.value=text;state.searchQuery=text;toast('음성 입력을 완료했어요.');} };
    recognition.onerror=()=>toast('음성 입력을 진행하지 못했어요. 권한을 확인해 주세요.');
    recognition.start(); toast('음성을 듣고 있어요. 말씀해 주세요.');
  } catch(e){ toast('음성 입력을 시작할 수 없습니다.'); }
}
function choosePhoto(slotId){state.uploadSlot=slotId; const input=$('#photoFileInput');input.value='';input.click();}
$('#photoFileInput').addEventListener('change', (event)=>{
  const file=event.target.files?.[0];if(!file || !state.uploadSlot)return;
  if(!/^image\/(png|jpeg|webp|avif)$/.test(file.type)){toast('PNG, JPG, WEBP 또는 AVIF 파일을 선택해 주세요.');return;}
  if(file.size>10*1024*1024){toast('10MB 이하의 사진을 선택해 주세요.');return;}
  if(state.photos[state.uploadSlot]?.startsWith('blob:'))URL.revokeObjectURL(state.photos[state.uploadSlot]);
  state.photos[state.uploadSlot]=URL.createObjectURL(file);
  render(true);toast('사진을 교체했어요. 새로고침하면 원래 사진으로 돌아갑니다.');
});

document.addEventListener('submit',e=>{
  if(e.target.id!=='searchForm')return;
  e.preventDefault();const q=new FormData(e.target).get('query')?.toString().trim()||'';
  if(!q){toast('찾고 싶은 간식이나 조건을 입력해 주세요.');return;}
  state.searchQuery=q;state.category='all';nav('search');
});
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-detail],.modal-backdrop');if(!t)return;
  const {nav:navPage,category,action,detail:detailId,fav,add,pref,quantity,delta,savedTab,photo:photoId}=t.dataset;
  if(fav){ e.stopPropagation();setFavorite(fav);if($('#modalRoot').classList.contains('show'))detail(fav);return; }
  if(detailId){detail(detailId);return;}
  if(add){updateCart(add,1);closeModal();return;}
  if(quantity){updateCart(quantity,Number(delta));return;}
  if(navPage){nav(navPage);return;}
  if(category){nav('menu',{category});return;}
  if(savedTab){state.savedTab=savedTab;render(true);return;}
  if(photoId){choosePhoto(photoId);return;}
  if(pref){if(pref==='vegan')return;state.prefs[pref]=!state.prefs[pref];saveValue('prefs',state.prefs);t.setAttribute('aria-checked',String(state.prefs[pref]));render(true);return;}
  switch(action){
    case 'conditions':conditions();break;
    case 'close-modal':closeModal();break;
    case 'save-conditions':closeModal();toast('식이조건이 적용되었습니다.');break;
    case 'notifications':showNotifications();break;
    case 'cart':nav('saved',{savedTab:'cart'});break;
    case 'more':nav('search');break;
    case 'voice':startVoice();break;
    case 'checkout':toast('이 화면은 시연용으로, 실제 주문과 결제는 연결되지 않았습니다.');break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && $('#modalRoot').classList.contains('show'))closeModal();
  if((e.key==='Enter'||e.key===' ') && e.target.matches('.recipe-image-wrap[data-detail]')){ e.preventDefault();detail(e.target.dataset.detail); }
});

render();

</script>
</body>
</html>
